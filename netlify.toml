[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Bot Telegram (Netlify Function, gratis tanpa sleep)
[[redirects]]
  from = "/api/telegram/*"
  to = "/.netlify/functions/telegram"
  status = 200

# Fallback lama ke backend terpisah (opsional, aktifkan bila perlu)
# [[redirects]]
#   from = "/api/*"
#   to = "https://api-myeconomy.onrender.com/:splat"
#   status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
