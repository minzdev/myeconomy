[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Bot Telegram (Netlify Function, gratis tanpa sleep)
[[redirects]]
  from = "/api/telegram/*"
  to = "/.netlify/functions/telegram"
  status = 200

# Reset password email HTML (Netlify Function, tanpa backend terpisah)
[[redirects]]
  from = "/api/auth/reset-email"
  to = "/.netlify/functions/reset-email"
  status = 200

# Fallback lama ke backend terpisah (opsional, aktifkan bila perlu)
# [[redirects]]
#   from = "/api/*"
#   to = "https://api-myeconomy.onrender.com/:splat"
#   status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers dasar (tanpa CSP ketat agar login Google/Firebase tidak terganggu)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
